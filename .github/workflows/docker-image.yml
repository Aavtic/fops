name: Build, Push and Deploy

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize image name (lowercase)
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry (CI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t $REGISTRY/$IMAGE_NAME:latest \
            -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
            backend

      - name: Push Docker image
        run: |
          docker push $REGISTRY/$IMAGE_NAME:latest
          docker push $REGISTRY/$IMAGE_NAME:${{ github.sha }}

      # ---------- DEPLOY ----------
      - name: Setup SSH
        run: |
          set -x
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      
          echo "Scanning SSH host key..."
          ssh-keyscan -T 5 -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts || \
            echo "ssh-keyscan failed, continuing anyway"
                  
      - name: Deploy
        run: |
          OLD_CONTAINER="aixel-analytics-container"
          TEMP_CONTAINER="aixel-analytics-temp"
          IMAGE_NAME="aixel-analytics:new"
      
          ssh -o StrictHostKeyChecking=no root@${{ secrets.DO_HOST }} << EOF
            set -e
      
            echo "Removing any existing temp container..."
            docker rm -f ${TEMP_CONTAINER} || true
      
            echo "Building new Docker image..."
            docker build -t ${IMAGE_NAME} .
      
            echo "Starting new container..."
            docker run -d -p 7791:7790 --name ${TEMP_CONTAINER} ${IMAGE_NAME}
          EOF
